[project]
name = "summative"
version = "0.1.0"
description = "Kiva loan-amount regression model and prediction API"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
    "pydantic>=2.10.0",
    "python-multipart>=0.0.12",
    "pandas>=2.2.0",
    "numpy>=2.0.0",
    "scikit-learn>=1.5.0",
    "joblib>=1.4.0",
]

[dependency-groups]
dev = [
    "matplotlib>=3.9.0",
    "seaborn>=0.13.0",
    "jupyter>=1.1.0",
    "ipykernel>=6.29.0",
    "nbconvert>=7.16.0",
    "nbclient>=0.10.0",
    "httpx>=0.27.0",
]

[tool.uv]
package = false
default-groups = []
